version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hypervibe
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/hypervibe
      JWT_SECRET: dev-secret-change-in-prod
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
    depends_on:
      - postgres
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

  prisma-studio:
    image: node:18
    working_dir: /app
    command: npx prisma studio --port 5555 --browser none
    ports:
      - '5555:5555'
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/hypervibe
    depends_on:
      - postgres
    volumes:
      - ./packages/database:/app

volumes:
  postgres_data:
