<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Core Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:var(--space-black);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:10px;overflow:hidden;border:1px solid var(--border-violet)}
.chip{height:64px}
.meta{padding:8px 10px;background:var(--midnight-blue)}
.name{font-family:var(--font-mono);font-size:11px;color:var(--text-primary);font-weight:500}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);margin-top:2px}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#0A0E1A"></div><div class="meta"><div class="name">space-black</div><div class="hex">#0A0E1A</div></div></div>
  <div class="sw"><div class="chip" style="background:#0F1B35"></div><div class="meta"><div class="name">midnight-blue</div><div class="hex">#0F1B35</div></div></div>
  <div class="sw"><div class="chip" style="background:#1A0A2E"></div><div class="meta"><div class="name">deep-violet</div><div class="hex">#1A0A2E</div></div></div>
  <div class="sw"><div class="chip" style="background:#7B2FBE"></div><div class="meta"><div class="name">hyper-violet</div><div class="hex">#7B2FBE</div></div></div>
  <div class="sw"><div class="chip" style="background:#A855F7"></div><div class="meta"><div class="name">hyper-violet-lt</div><div class="hex">#A855F7</div></div></div>
  <div class="sw"><div class="chip" style="background:#00D4FF"></div><div class="meta"><div class="name">neon-cyan</div><div class="hex">#00D4FF</div></div></div>
  <div class="sw"><div class="chip" style="background:#00FFFF"></div><div class="meta"><div class="name">pure-cyan</div><div class="hex">#00FFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#D946EF"></div><div class="meta"><div class="name">reward-pink</div><div class="hex">#D946EF</div></div></div>
</div>
</body></html>
