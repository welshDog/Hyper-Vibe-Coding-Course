<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows & Glow</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--space-black);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.cell{text-align:center}
.box{width:100%;height:64px;background:var(--midnight-blue);border:1px solid var(--border-violet);border-radius:12px;margin-bottom:8px}
.b1{box-shadow:0 4px 24px rgba(0,0,0,0.4)}
.b2{box-shadow:0 0 20px rgba(168,85,247,0.4),0 0 40px rgba(168,85,247,0.2)}
.b3{box-shadow:0 0 20px rgba(0,212,255,0.4),0 0 40px rgba(0,212,255,0.2)}
.b4{box-shadow:0 0 20px rgba(245,158,11,0.4),0 0 40px rgba(245,158,11,0.2)}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-primary)}
.use{font-size:10px;color:var(--text-secondary);margin-top:2px}
</style></head><body>
<div class="grid">
<div class="cell"><div class="box b1"></div><div class="tok">card-shadow</div><div class="use">depth · default</div></div>
<div class="cell"><div class="box b2"></div><div class="tok">glow-violet</div><div class="use">primary · hover</div></div>
<div class="cell"><div class="box b3"></div><div class="tok">glow-cyan</div><div class="use">tech · active</div></div>
<div class="cell"><div class="box b4"></div><div class="tok">glow-gold</div><div class="use">token · reward</div></div>
</div>
</body></html>
