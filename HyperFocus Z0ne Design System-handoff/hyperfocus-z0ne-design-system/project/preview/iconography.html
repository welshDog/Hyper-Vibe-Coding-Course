<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--space-black);font-family:var(--font-body)}
.row{display:flex;gap:18px;align-items:flex-start}
.col{flex:1}
.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);letter-spacing:0.08em;margin-bottom:8px}
.icons{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.icons svg{stroke:#A855F7}
.emoji{font-size:22px}
.note{font-size:11px;color:var(--text-secondary);margin-top:8px;line-height:1.5}
</style></head><body>
<div class="row">
  <div class="col">
    <div class="lbl">LUCIDE · STROKE 2 · 22px</div>
    <div class="icons">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 0 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 0 1 12 18Z"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22 22 0 0 1-3.95 2z"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <div class="note">Brain · Bolt · Target · Sparkle · File · Search</div>
  </div>
  <div class="col">
    <div class="lbl">BRAND EMOJI · WAYFINDING</div>
    <div class="icons emoji">
      <span>🧠</span><span>🎓</span><span>🐾</span><span>⚡</span><span>🎯</span><span>🚀</span><span>♾️</span><span>🔥</span><span>🪙</span><span>🎉</span><span>🏴󠁧󠁢󠁷󠁬󠁳󠁿</span>
    </div>
    <div class="note">Punctuation, not centerpiece. ≤1 per heading.</div>
  </div>
</div>
</body></html>
