<!doctype html>
<html><head><meta charset="utf-8"><title>Voice & Tone</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:var(--space-black);font-family:var(--font-body);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.col{padding:10px 12px;border-radius:8px;border:1px solid var(--border-violet);background:var(--midnight-blue)}
.h{font-family:var(--font-mono);font-size:10px;letter-spacing:0.1em;margin-bottom:6px}
.no{color:#EF4444}.yes{color:#10F5A0}.surface{color:var(--text-secondary)}
.line{margin-bottom:6px;line-height:1.4}
.surface .line{font-weight:600;color:var(--text-primary)}
</style></head><body>
<div class="grid">
  <div class="col surface"><div class="h">SURFACE</div>
    <div class="line">Button</div><div class="line">Error</div><div class="line">Empty</div><div class="line">Loading</div><div class="line">Success</div></div>
  <div class="col"><div class="h no">❌ DON'T</div>
    <div class="line">Submit</div><div class="line">Error 400</div><div class="line">No items</div><div class="line">Loading...</div><div class="line">Success</div></div>
  <div class="col"><div class="h yes">✅ DO</div>
    <div class="line">Let's GO →</div><div class="line">Hmm, try again 🔄</div><div class="line">Quests show up here 🎯</div><div class="line">Wiring up the Z0ne...</div><div class="line">NICE ONE BROski♾️ 🎉</div></div>
</div>
</body></html>
