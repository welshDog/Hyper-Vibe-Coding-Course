<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--space-black);font-family:var(--font-body);display:flex;align-items:center;gap:24px}
.mark{width:140px;height:140px;border-radius:50%;object-fit:cover;border:2px solid #7B2FBE;box-shadow:0 0 24px rgba(123,47,190,0.4)}
.text{flex:1}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--text-primary);line-height:1}
.tag{margin-top:10px;color:#A855F7;font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em}
.notes{margin-top:12px;font-size:12px;color:var(--text-secondary);line-height:1.6}
</style></head><body>
<img class="mark" src="../assets/logo-mark.jpg" alt="HyperFocus Z0ne logo — neon brain with HFZ triangle monogram">
<div class="text">
  <div class="wordmark">HyperFocus<br>Z0ne</div>
  <div class="tag">ENTER THE Z0NE · BUILD THE FUTURE</div>
  <div class="notes">Brain inside violet ring · cyan HFZ triangle · dark backgrounds only.</div>
</div>
</body></html>
