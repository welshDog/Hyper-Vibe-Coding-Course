<!doctype html>
<html><head><meta charset="utf-8"><title>Progress · XP & BROski$</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--space-black);font-family:var(--font-body);display:flex;flex-direction:column;gap:18px}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);font-weight:600;letter-spacing:0.05em;margin-bottom:6px}
.lbl .v{color:var(--text-primary);font-family:var(--font-mono)}
.track{height:8px;background:rgba(255,255,255,0.08);border-radius:9999px;overflow:hidden}
.fill{height:100%;border-radius:9999px}
.xp{background:linear-gradient(90deg,#7B2FBE,#00D4FF)}
.gold{background:linear-gradient(90deg,#F59E0B,#FCD34D)}
.health{background:#10F5A0}
.bar-lg .track{height:14px}
</style></head><body>
<div><div class="lbl"><span>XP · LEVEL 7</span><span class="v">2,840 / 4,000</span></div>
  <div class="track"><div class="fill xp" style="width:71%"></div></div></div>
<div><div class="lbl"><span>BROski$ · WEEKLY</span><span class="v">340 / 500</span></div>
  <div class="track"><div class="fill gold" style="width:68%"></div></div></div>
<div class="bar-lg"><div class="lbl"><span>QUEST PROGRESS</span><span class="v">3 / 5 STEPS</span></div>
  <div class="track"><div class="fill health" style="width:60%"></div></div></div>
</body></html>
