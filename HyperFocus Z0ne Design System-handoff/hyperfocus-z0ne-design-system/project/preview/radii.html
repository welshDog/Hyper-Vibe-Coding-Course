<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px;background:var(--space-black);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{width:80px;height:64px;background:var(--midnight-blue);border:1px solid var(--border-violet)}
.tok{font-family:var(--font-mono);font-size:10px;color:var(--text-primary)}
.use{font-size:10px;color:var(--text-secondary);text-align:center;line-height:1.3}
</style></head><body>
<div class="grid">
<div class="cell"><div class="box" style="border-radius:6px"></div><div class="tok">sm · 6px</div><div class="use">inputs · tags</div></div>
<div class="cell"><div class="box" style="border-radius:12px"></div><div class="tok">md · 12px</div><div class="use">cards · panels</div></div>
<div class="cell"><div class="box" style="border-radius:16px"></div><div class="tok">lg · 16px</div><div class="use">modals</div></div>
<div class="cell"><div class="box" style="border-radius:24px"></div><div class="tok">xl · 24px</div><div class="use">pet cards</div></div>
<div class="cell"><div class="box" style="border-radius:9999px"></div><div class="tok">full</div><div class="use">pills · avatars</div></div>
</div>
</body></html>
