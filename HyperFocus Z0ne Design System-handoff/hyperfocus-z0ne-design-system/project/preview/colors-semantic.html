<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Semantic & Reward</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:var(--space-black);font-family:var(--font-body)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:10px;overflow:hidden;border:1px solid var(--border-violet)}
.chip{height:64px}
.meta{padding:8px 10px;background:var(--midnight-blue)}
.name{font-family:var(--font-mono);font-size:11px;color:var(--text-primary);font-weight:500}
.hex{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);margin-top:2px}
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#F59E0B"></div><div class="meta"><div class="name">broski-gold</div><div class="hex">#F59E0B · token</div></div></div>
  <div class="sw"><div class="chip" style="background:#FCD34D"></div><div class="meta"><div class="name">gold-light</div><div class="hex">#FCD34D · hover</div></div></div>
  <div class="sw"><div class="chip" style="background:#10F5A0"></div><div class="meta"><div class="name">success-mint</div><div class="hex">#10F5A0 · healthy</div></div></div>
  <div class="sw"><div class="chip" style="background:#FBBF24"></div><div class="meta"><div class="name">warning-amber</div><div class="hex">#FBBF24 · caution</div></div></div>
  <div class="sw"><div class="chip" style="background:#EF4444"></div><div class="meta"><div class="name">danger-red</div><div class="hex">#EF4444 · critical</div></div></div>
  <div class="sw"><div class="chip" style="background:#F0F4FF"></div><div class="meta"><div class="name">text-primary</div><div class="hex">#F0F4FF</div></div></div>
  <div class="sw"><div class="chip" style="background:#8B9CC8"></div><div class="meta"><div class="name">text-secondary</div><div class="hex">#8B9CC8</div></div></div>
  <div class="sw"><div class="chip" style="background:#3D4F6E"></div><div class="meta"><div class="name">text-disabled</div><div class="hex">#3D4F6E</div></div></div>
</div>
</body></html>
