<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--space-black);font-family:var(--font-body);display:flex;flex-direction:column;gap:12px}
.lbl{font-size:14px;font-weight:600;color:var(--text-secondary);letter-spacing:0.05em;margin-bottom:4px;display:block}
input,textarea,select{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(168,85,247,0.3);border-radius:8px;padding:12px 16px;font-family:var(--font-body);font-size:16px;color:var(--text-primary);box-sizing:border-box;transition:all .2s}
input::placeholder{color:#3D4F6E}
input:focus,textarea:focus{outline:none;border-color:#A855F7;box-shadow:0 0 0 3px rgba(168,85,247,0.15)}
.focused{border-color:#A855F7!important;box-shadow:0 0 0 3px rgba(168,85,247,0.15)}
</style></head><body>
<div><span class="lbl">EMAIL</span><input placeholder="bro@hyperfocus.zone"></div>
<div><span class="lbl">PASSWORD · FOCUSED</span><input type="password" class="focused" value="••••••••••"></div>
<div><span class="lbl">QUEST NOTES</span><textarea rows="2" placeholder="What did you ship today?"></textarea></div>
</body></html>
