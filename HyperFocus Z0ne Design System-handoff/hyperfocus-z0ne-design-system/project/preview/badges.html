<!doctype html>
<html><head><meta charset="utf-8"><title>Badges & Status</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{
    margin:0;padding:24px;
    background:var(--space-black);
    font-family:var(--font-body);
    display:flex;flex-direction:column;gap:22px;
  }
  .group{display:flex;flex-direction:column;gap:10px}
  .group-label{
    font-family:var(--font-mono);font-size:10px;font-weight:600;
    letter-spacing:0.12em;color:var(--text-secondary);
    text-transform:uppercase;
  }
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  /* ---- STATUS BADGES ---- */
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px;border-radius:9999px;
    font-family:var(--font-body);font-weight:600;font-size:12px;
    letter-spacing:0.08em;text-transform:uppercase;
    border:1px solid transparent;
    transition:all .25s var(--ease-smooth);
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    flex-shrink:0;position:relative;
  }
  .badge.healthy{
    background:rgba(16,245,160,0.10);
    border-color:rgba(16,245,160,0.35);
    color:#10F5A0;
  }
  .badge.healthy .dot{
    background:#10F5A0;
    box-shadow:0 0 8px rgba(16,245,160,0.9), 0 0 14px rgba(16,245,160,0.4);
    animation:pulseDot 2.4s ease-in-out infinite;
  }
  .badge.warn{
    background:rgba(251,191,36,0.10);
    border-color:rgba(251,191,36,0.35);
    color:#FBBF24;
  }
  .badge.warn .dot{
    background:#FBBF24;
    box-shadow:0 0 8px rgba(251,191,36,0.7);
  }
  .badge.err{
    background:rgba(239,68,68,0.10);
    border-color:rgba(239,68,68,0.35);
    color:#FCA5A5;
  }
  .badge.err .dot{
    background:#EF4444;
    box-shadow:0 0 8px rgba(239,68,68,0.7);
  }
  .badge.idle{
    background:rgba(139,156,200,0.06);
    border-color:rgba(139,156,200,0.25);
    color:#8B9CC8;
  }
  .badge.idle .dot{ background:#8B9CC8; opacity:.7 }

  @keyframes pulseDot{
    0%,100%{ transform:scale(1); opacity:1 }
    50%    { transform:scale(1.25); opacity:.75 }
  }

  /* ---- LOYALTY TIERS ---- */
  .tier{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 16px;border-radius:9999px;
    font-family:var(--font-display);font-weight:700;font-size:11px;
    letter-spacing:0.14em;text-transform:uppercase;
    position:relative;
    border:1px solid transparent;
  }
  .tier .pip{
    width:6px;height:6px;border-radius:50%;
    background:currentColor;
    flex-shrink:0;
  }

  /* Bronze — warm copper, subtle shimmer on text */
  .tier.bronze{
    background:linear-gradient(135deg, #4A2A12 0%, #6B3D1A 100%);
    border-color:rgba(205, 127, 50, 0.45);
    color:#E89B5A;
    box-shadow:inset 0 1px 0 rgba(205,127,50,0.25), 0 2px 8px rgba(0,0,0,0.4);
  }
  /* Silver — cool steel */
  .tier.silver{
    background:linear-gradient(135deg, #2A3548 0%, #455269 100%);
    border-color:rgba(192,205,225,0.4);
    color:#DCE5F2;
    box-shadow:inset 0 1px 0 rgba(220,229,242,0.18), 0 2px 8px rgba(0,0,0,0.4);
  }
  /* Gold — true gold gradient, dark text */
  .tier.gold{
    background:linear-gradient(135deg, #F59E0B 0%, #FCD34D 50%, #F59E0B 100%);
    background-size:200% 100%;
    color:#1A0A2E;
    border-color:rgba(252,211,77,0.6);
    box-shadow:0 2px 12px rgba(245,158,11,0.35), inset 0 1px 0 rgba(255,255,255,0.4);
    animation:goldShimmer 4s linear infinite;
  }
  @keyframes goldShimmer{
    0%   { background-position:0% 50% }
    100% { background-position:200% 50% }
  }

  /* Hyper — top-tier, holographic edge + violet→cyan core */
  .tier.hyper{
    background:linear-gradient(135deg, #7B2FBE 0%, #A855F7 50%, #00D4FF 100%);
    color:#fff;
    border-color:rgba(168,85,247,0.7);
    box-shadow:
      0 0 20px rgba(168,85,247,0.45),
      0 0 40px rgba(0,212,255,0.25),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .tier.hyper::before{
    content:"";
    position:absolute;inset:-2px;
    border-radius:9999px;
    background:linear-gradient(135deg,#D946EF,#A855F7,#00D4FF,#10F5A0,#FCD34D,#D946EF);
    background-size:300% 300%;
    animation:holographic 3s ease infinite;
    z-index:-1;
    filter:blur(6px);
    opacity:.55;
  }
  .tier.hyper .pip{ box-shadow:0 0 6px #fff }

  /* ---- SIZE / VARIANTS ---- */
  .badge.sm{ padding:4px 10px; font-size:10px }
  .badge.sm .dot{ width:6px;height:6px }
</style></head>
<body>

<div class="group">
  <div class="group-label">System status · live agents, builds, contracts</div>
  <div class="row">
    <span class="badge healthy"><span class="dot"></span>Healthy</span>
    <span class="badge warn"><span class="dot"></span>Warning</span>
    <span class="badge err"><span class="dot"></span>Error</span>
    <span class="badge idle"><span class="dot"></span>Inactive</span>
  </div>
</div>

<div class="group">
  <div class="group-label">Loyalty tiers · BROski♾️ progression</div>
  <div class="row">
    <span class="tier bronze"><span class="pip"></span>Bronze</span>
    <span class="tier silver"><span class="pip"></span>Silver</span>
    <span class="tier gold"><span class="pip"></span>Gold</span>
    <span class="tier hyper"><span class="pip"></span>Hyper ♾️</span>
  </div>
</div>

</body></html>
