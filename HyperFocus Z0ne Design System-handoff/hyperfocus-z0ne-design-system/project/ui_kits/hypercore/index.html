<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HyperCore — Agent Dashboard</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body{margin:0;background:var(--space-black)}
  .app{display:grid;grid-template-columns:220px 1fr 380px;height:100vh}
  .main{overflow-y:auto;padding:24px 28px}
  .right{padding:16px;border-left:1px solid rgba(0,212,255,0.1);overflow:hidden}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .agents{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel">
const AGENTS = [
  { name:'orchestrator', role:'task router · master', status:'healthy', ctn:'hc_orchestrator_01', cpu:12, mem:128 },
  { name:'tutor.alpha',  role:'lesson companion', status:'healthy', ctn:'hc_tutor_alpha_03', cpu:34, mem:412 },
  { name:'codegen',      role:'natural lang → code', status:'healthy', ctn:'hc_codegen_07', cpu:78, mem:1024 },
  { name:'reviewer',     role:'PR reviewer · linter', status:'healthy', ctn:'hc_reviewer_04', cpu:22, mem:256 },
  { name:'token.sync',   role:'BROski$ ↔ supabase', status:'warn',    ctn:'hc_token_sync_01', cpu:8,  mem:96  },
  { name:'pet.evolve',   role:'dNFT evolution', status:'healthy', ctn:'hc_pet_evolve_02', cpu:5,  mem:64  },
  { name:'venom.guard',  role:'prompt injection shield', status:'healthy', ctn:'hc_venom_01',     cpu:3,  mem:48  },
  { name:'ipfs.pin',     role:'metadata pinner', status:'idle',    ctn:'hc_ipfs_pin_01',   cpu:1,  mem:32  },
];

const LOGS = [
  { t:'12:04:11', k:'ok',   msg:'[orchestrator] queue depth: 3 · routed quest_124' },
  { t:'12:04:11', k:'ok',   msg:'[tutor.alpha] response 412ms · user 8a2f' },
  { t:'12:04:10', k:'ok',   msg:'[codegen] codegen.complete · tokens=1840' },
  { t:'12:04:10', k:'meta', msg:'[reviewer] scanning PR #142 (38 files)' },
  { t:'12:04:09', k:'warn', msg:'[token.sync] retry supabase write (3/5)' },
  { t:'12:04:09', k:'ok',   msg:'[pet.evolve] EEP 023 → stage TRAINED' },
  { t:'12:04:08', k:'ok',   msg:'[venom.guard] 0 blocks last 60s' },
  { t:'12:04:08', k:'meta', msg:'[ipfs.pin] idle · last pin 4m ago' },
  { t:'12:04:07', k:'ok',   msg:'[orchestrator] heartbeat · 29/29 healthy' },
  { t:'12:04:06', k:'ok',   msg:'[codegen] cold start finished · 2.1s' },
  { t:'12:04:05', k:'ok',   msg:'[tutor.alpha] streaming chunk 14/22' },
  { t:'12:04:04', k:'meta', msg:'[orchestrator] tick' },
];

function App(){
  const [view, setView] = React.useState('overview');
  return (
    <div className="app" data-screen-label="01 Agents Overview">
      <HCSidebar active={view} onNavigate={setView} />
      <div className="main">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
          <div>
            <h1 style={{margin:0,fontFamily:'var(--font-display)',fontSize:28,fontWeight:700}}>Agent Swarm</h1>
            <div style={{color:'#8B9CC8',marginTop:4,fontSize:13}}>29 agents. One brain. Zero limits.</div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <HCStatus kind="healthy">29 / 29 ONLINE</HCStatus>
            <HCStatus kind="warn">1 RETRY</HCStatus>
          </div>
        </div>
        <div className="metrics">
          <HCMetric label="REQUESTS · 1H" value="14,820" accent="#00D4FF" />
          <HCMetric label="P95 LATENCY" value="412" unit="ms" accent="#A855F7" />
          <HCMetric label="TOKENS · 1H" value="2.4" unit="M" accent="#10F5A0" />
          <HCMetric label="COST · 1H" value="$0.84" accent="#FCD34D" />
        </div>
        <div style={{fontSize:12,color:'#8B9CC8',fontWeight:700,letterSpacing:'0.08em',marginBottom:10}}>CONTAINERS</div>
        <div className="agents">
          {AGENTS.map(a => <HCAgentCard key={a.name} {...a} />)}
        </div>
      </div>
      <div className="right">
        <HCLogStream lines={LOGS} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
