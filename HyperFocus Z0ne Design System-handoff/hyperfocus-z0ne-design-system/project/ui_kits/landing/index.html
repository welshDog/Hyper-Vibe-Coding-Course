<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body{ margin:0; background:var(--space-black); }
  /* Override base body line-height for left-aligned, dyslexia-friendly long-form */
  body, p, li{ text-align:left; }
  em, i{ font-style:normal; font-weight:600; color:#00D4FF; } /* No italics — emphasise via weight + color */
  @keyframes twinkle{
    0%, 100%{ opacity:.2; transform:scale(1); }
    50%     { opacity:.9; transform:scale(1.4); }
  }
  @keyframes holographic{
    0%   { background-position:0% 50% }
    50%  { background-position:100% 50% }
    100% { background-position:0% 50% }
  }
  /* Responsive */
  @media (max-width: 900px){
    section [style*="grid-template-columns: 1.2fr 1fr"],
    section [style*="grid-template-columns: repeat(3, 1fr)"],
    footer  [style*="grid-template-columns: 1.4fr 1fr 1fr 1fr"]{
      grid-template-columns: 1fr !important;
    }
  }
</style>
